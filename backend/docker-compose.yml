# Stack "de produção": PostgreSQL + MinIO + API + N workers
#   docker compose up --build --scale worker=3
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: docfactory, POSTGRES_PASSWORD: docfactory, POSTGRES_DB: docfactory }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "docfactory"], interval: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]   # 9001 = console web

  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment: &env
      DATABASE_URL: postgresql+psycopg://docfactory:docfactory@postgres:5432/docfactory
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      DATA_DIR: /tmp/docfactory
      WORKER_INLINE: "false"
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_started } }

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [{ path: .env, required: false }]
    environment: *env
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_started } }
    stop_grace_period: 60s   # deixa terminar a página atual

volumes:
  pgdata:
  miniodata:
